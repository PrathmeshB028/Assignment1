<!DOCTYPE html>
<html>
<head>
    <title>Scientific Calculator</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:#dbeeff;
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .calculator{
            background:#71afed;
            padding:20px;
            border-radius:15px;
            width:350px;
            box-shadow:0 0 15px gray;
            text-align:center;
        }

        h2{
            color:white;
            margin-top:0;
        }

        #display{
            width:95%;
            height:50px;
            font-size:24px;
            text-align:right;
            margin-bottom:15px;
            padding-right:10px;
            border:none;
            border-radius:5px;
        }

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
        }

        button{
            padding:15px;
            font-size:18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:white;
            font-weight:bold;
        }

        button:hover{
            background:#e0e0e0;
        }

        .equal{
            background:rgb(13, 64, 32);
            color:white;
        }

        .clear{
            background:rgb(2, 85, 11);
            color:white;
        }

        .watermark{
            margin-top:20px;
            color:white;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="calculator">

<h2>Scientific Calculator</h2>

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()" class="clear">C</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button onclick="append('/')">÷</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('*')">×</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')">−</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('+')">+</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="square()">x²</button>
<button onclick="sqrt()">√</button>

<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>
<button onclick="log()">log</button>

<button class="equal" style="grid-column: span 4;" onclick="calculate()">= Calculate</button>

</div>

<div class="watermark">
<hr>
<b>Submitted By:</b> Ayushi Rathore <br>
<b>PRN:</b> 1272250327
</div>

</div>

<script>

function append(value){
    document.getElementById("display").value += value;
}

function clearDisplay(){
    document.getElementById("display").value="";
}

function calculate(){
    try{
        document.getElementById("display").value =
        eval(document.getElementById("display").value);
    }
    catch{
        alert("Invalid Expression");
    }
}

function square(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=x*x;
}

function sqrt(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=Math.sqrt(x);
}

function sin(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=Math.sin(x*Math.PI/180);
}
function cos(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=Math.cos(x*Math.PI/180);
}

function tan(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=Math.tan(x*Math.PI/180);
}

function log(){
    let x=parseFloat(document.getElementById("display").value);
    document.getElementById("display").value=Math.log10(x);
}

</script>

</body>
</html>
