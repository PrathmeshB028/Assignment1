<!DOCTYPE html>
<html>
<head>
    <title>JS Calculator</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 350px;
            padding: 20px;
            background-color: rgb(255, 255, 255);
            border: 2px solid black;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .watermark {
            margin-top: 25px;
            font-size: 14px;
            color: gray;
        }
    </style>

    <script>
        function add() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (num1 + num2);
        }

        function subtract() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (num1 - num2);
        }

        function multiply() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerHTML = "Result: " + (num1 * num2);
        }

        function divide() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);

            if (num2 == 0) {
                document.getElementById("result").innerHTML = "Cannot Divide by Zero";
            } else {
                document.getElementById("result").innerHTML = "Result: " + (num1 / num2);
            }
        }
    </script>

</head>

<body>

    <div class="calculator">

        <h2>JS Calculator</h2>

        <input type="number" id="num1" placeholder="Enter First Number"><br>

        <input type="number" id="num2" placeholder="Enter Second Number"><br><br>

        <button onclick="add()">Addition</button>
        <button onclick="subtract()">Subtraction</button><br>

        <button onclick="multiply()">Multiplication</button>
        <button onclick="divide()">Division</button>

        <div id="result">Result:</div>

        <div class="watermark">
            <hr>
            <b>Submitted By:</b> prathmesh borade <br>
            <b>PRN:</b> 1272250099
        </div>

    </div>

</body>
</html>
